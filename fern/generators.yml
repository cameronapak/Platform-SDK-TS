# Python, Go, and Rust pins match Cloudflare Forge commit 00b8ede867530f8891fe4124b2f5f20ee8d0b05e.
# TypeScript retains its existing Forge transformer in scripts/generate.mjs.
api:
  specs:
    - openapi: ../.cache/openapi.fern.json
      settings:
        only-include-referenced-schemas: false
        object-query-parameters: true
        respect-nullable-schemas: true
        coerce-enums-to-literals: true
        path-parameter-order: url-order
        resolve-schema-collisions: true
default-group: python-sdk
groups:
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 5.18.1
        output:
          location: local-file-system
          path: ../.cache/python-generated
        config:
          package_name: cameronapak_platform_sdk
          client:
            class_name: PlatformClient
  go-sdk:
    generators:
      - name: fernapi/fern-go-sdk
        version: 1.47.2
        output:
          location: local-file-system
          path: ../.cache/go-generated
        config:
          module:
            path: github.com/cameronapak/Platform-SDK-TS/packages/go
            version: '1.24'
          packageName: platform
          clientName: PlatformClient
          clientConstructorName: NewPlatformClient
  rust-sdk:
    generators:
      - name: fernapi/fern-rust-sdk
        version: 0.42.1
        output:
          location: local-file-system
          path: ../.cache/rust-generated
        config:
          clientClassName: PlatformClient
          crateName: cameronapak-platform-sdk
          crateVersion: '0.1.0'
          packageDescription: Experimental unofficial SDK for the YouVersion Platform API
          packageLicense: Apache-2.0
          packageRepository: https://github.com/cameronapak/Unofficial-YouVersion-Platform-SDKs
          extraDependencies:
            reqwest:
              version: '0.12'
              features: [json, stream, gzip, rustls-tls]
              default-features: false
            percent-encoding: '2'
