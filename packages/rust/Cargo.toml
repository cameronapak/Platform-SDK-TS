[package]
name = "cameronapak_platform_sdk"
version = "0.1.0"
edition = "2021"
publish = false
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "sdk-map.json"]
description = "Experimental unofficial SDK for the YouVersion Platform API"
license = "Apache-2.0"
repository = "https://github.com/cameronapak/Unofficial-YouVersion-Platform-SDKs"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
percent-encoding = "2"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
tokio-test = "0.4"
